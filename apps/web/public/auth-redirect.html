<!DOCTYPE html>
<html>
<head>
  <title>Signing in…</title>
  <meta charset="utf-8" />
</head>
<body>
  <script src="/msal-browser.min.js"></script>
  <script>
    console.log("[Auth Redirect] Loaded");
    console.log("[Auth Redirect] Has opener:", !!window.opener);

    const msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: "bd1a125d-bb30-4d9e-9194-93a475450c82",
        authority: "https://login.microsoftonline.com/dd1ca075-de8f-40c4-bebb-c90103860dba",
        redirectUri: window.location.origin + "/auth-redirect.html",
      },
      cache: {
        cacheLocation: "sessionStorage",
      },
    });

    msalInstance.initialize().then(() => {
      console.log("[Auth Redirect] MSAL initialized");
      return msalInstance.handleRedirectPromise();
    }).then((result) => {
      console.log("[Auth Redirect] handleRedirectPromise result:", result);
    }).catch((err) => {
      console.error("[Auth Redirect] Error:", err);
    });
  </script>
</body>
</html>
